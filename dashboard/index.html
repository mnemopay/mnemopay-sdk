<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' http://localhost:3200; img-src 'self' data:;">
<meta http-equiv="X-Content-Type-Options" content="nosniff">

<title>MnemoPay Live Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { outfit: ['Outfit', 'sans-serif'] },
      colors: {
        void: '#07090F', cortex: '#0D1117', teal: '#0D9488',
        mnemo: '#3B82F6', indigo: '#818CF8', signal: '#F0F6FF',
        glass: 'rgba(255,255,255,0.05)', glassBorder: 'rgba(255,255,255,0.08)'
      }
    }
  }
}
</script>
<style>
  body { font-family: 'Outfit', sans-serif; background: #07090F; }
  .glass { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(12px); }
  .glow-teal { box-shadow: 0 0 20px rgba(13,148,136,0.3); }
  .glow-blue { box-shadow: 0 0 20px rgba(59,130,246,0.3); }
  .stat-card:hover { transform: translateY(-2px); transition: all 0.2s; }
  .memory-row:hover { background: rgba(255,255,255,0.04); }
  .fade-in { animation: fadeIn 0.3s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .pulse { animation: pulse 2s infinite; }
  .scrollbar-thin::-webkit-scrollbar { width: 4px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
  .rep-bar { transition: width 0.5s ease; }
  .tab-active { border-bottom: 2px solid #0D9488; color: #0D9488; }
  .status-badge { padding: 2px 8px; border-radius: 9999px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .status-forked { background: rgba(59,130,246,0.15); color: #60A5FA; }
  .status-pr-open { background: rgba(13,148,136,0.15); color: #2DD4BF; }
  .status-merged { background: rgba(168,85,247,0.15); color: #C084FC; }
  .status-pr-closed { background: rgba(239,68,68,0.15); color: #FCA5A5; }
  .status-error { background: rgba(239,68,68,0.15); color: #FCA5A5; }
  .repo-card { transition: all 0.2s; }
  .repo-card:hover { border-color: rgba(13,148,136,0.3); transform: translateY(-1px); }
</style>
</head>
<body class="bg-void text-signal min-h-screen">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ── API client (talks to real SDK backend) ────────────────────────────────
const API_BASE = window.location.origin;
const ACCOUNT_STORAGE_KEY = 'mnemopay.dashboard.account';

function getAccountId() {
  const stored = localStorage.getItem(ACCOUNT_STORAGE_KEY);
  return (stored && stored.trim()) || 'default';
}

function setAccountId(accountId) {
  localStorage.setItem(ACCOUNT_STORAGE_KEY, accountId || 'default');
}

function accountHeaders() {
  return { 'X-MnemoPay-Account': getAccountId() };
}

const api = {
  async get(path) {
    const res = await fetch(`${API_BASE}${path}`, { headers: accountHeaders(), credentials: 'same-origin' });
    if (!res.ok) throw new Error(`API error: ${res.status}`);
    return res.json();
  },
  async post(path, body) {
    const res = await fetch(`${API_BASE}${path}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...accountHeaders() },
      body: JSON.stringify(body),
      credentials: 'same-origin',
    });
    if (!res.ok) throw new Error(`API error: ${res.status}`);
    return res.json();
  },
  async del(path) {
    const res = await fetch(`${API_BASE}${path}`, { method: 'DELETE', headers: accountHeaders(), credentials: 'same-origin' });
    if (!res.ok) throw new Error(`API error: ${res.status}`);
    return res.json();
  },
};

// ── Sanitize text to prevent XSS ──────────────────────────────────────────
function sanitize(str) {
  if (typeof str !== 'string') return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ── Components ────────────────────────────────────────────────────────────

function StatCard({ label, value, sub, color = 'teal', icon }) {
  const colors = {
    teal: 'from-teal-500/20 to-teal-500/5 border-teal-500/20',
    blue: 'from-mnemo/20 to-mnemo/5 border-mnemo/20',
    indigo: 'from-indigo/20 to-indigo/5 border-indigo/20',
    amber: 'from-amber-500/20 to-amber-500/5 border-amber-500/20',
    purple: 'from-purple-500/20 to-purple-500/5 border-purple-500/20'
  };
  return (
    <div className={`stat-card glass rounded-xl p-5 bg-gradient-to-br ${colors[color]} cursor-default`}>
      <div className="flex items-center justify-between mb-2">
        <span className="text-xs uppercase tracking-wider text-gray-400">{label}</span>
        <span className="text-lg">{icon}</span>
      </div>
      <div className="text-2xl font-bold text-white">{value}</div>
      {sub && <div className="text-xs text-gray-400 mt-1">{sub}</div>}
    </div>
  );
}

function ReputationBar({ value }) {
  const pct = Math.round((value || 0) * 100);
  const color = pct >= 70 ? 'bg-teal' : pct >= 40 ? 'bg-amber-500' : 'bg-red-500';
  return (
    <div className="w-full">
      <div className="flex justify-between text-xs mb-1">
        <span className="text-gray-400">Reputation Score</span>
        <span className="text-white font-mono">{(value || 0).toFixed(3)}</span>
      </div>
      <div className="w-full h-2 bg-white/5 rounded-full overflow-hidden">
        <div className={`rep-bar h-full ${color} rounded-full`} style={{ width: `${pct}%` }} />
      </div>
    </div>
  );
}

function ConnectionIndicator({ connected }) {
  return (
    <div className="flex items-center gap-2">
      <span className={`w-2 h-2 rounded-full ${connected ? 'bg-teal pulse' : 'bg-red-500'}`} />
      <span className="text-xs text-gray-400">{connected ? 'Live (real SDK)' : 'Disconnected'}</span>
    </div>
  );
}

function MemoryPanel({ memories, onRefresh }) {
  const [newContent, setNewContent] = useState('');
  const [newTags, setNewTags] = useState('');
  const [search, setSearch] = useState('');
  const [saving, setSaving] = useState(false);

  const filtered = search
    ? memories.filter(m => m.content.toLowerCase().includes(search.toLowerCase()) || (m.tags || []).some(t => t.includes(search.toLowerCase())))
    : memories;

  const handleStore = async () => {
    if (!newContent.trim() || saving) return;
    setSaving(true);
    try {
      await api.post('/api/memories', { content: newContent.trim(), tags: newTags.split(',').map(t => t.trim()).filter(Boolean) });
      setNewContent(''); setNewTags('');
      onRefresh();
    } catch (e) { console.error('Store failed:', e); }
    setSaving(false);
  };

  const handleReinforce = async (id) => {
    await api.post('/api/memories/reinforce', { id, boost: 0.1 });
    onRefresh();
  };

  const handleForget = async (id) => {
    await api.del(`/api/memories/${id}`);
    onRefresh();
  };

  const handleConsolidate = async () => {
    await api.post('/api/memories/consolidate', {});
    onRefresh();
  };

  return (
    <div className="space-y-4 fade-in">
      <div className="glass rounded-xl p-4">
        <h3 className="text-sm font-semibold text-gray-300 mb-3">Store New Memory</h3>
        <textarea
          className="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-sm text-white placeholder-gray-500 focus:border-teal/50 focus:outline-none resize-none"
          rows="2" placeholder="What should the agent remember?"
          value={newContent} onChange={e => setNewContent(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleStore(); }}}
        />
        <div className="flex gap-2 mt-2">
          <input className="flex-1 bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:border-teal/50 focus:outline-none"
            placeholder="Tags (comma-separated)" value={newTags} onChange={e => setNewTags(e.target.value)} />
          <button onClick={handleStore} disabled={saving}
            className="px-4 py-2 bg-teal text-white rounded-lg text-sm font-medium hover:bg-teal-600 transition disabled:opacity-50">
            {saving ? '...' : 'Store'}
          </button>
        </div>
      </div>

      <div className="flex gap-2">
        <input className="flex-1 bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none"
          placeholder="Search memories..." value={search} onChange={e => setSearch(e.target.value)} />
        <button onClick={handleConsolidate}
          className="px-3 py-2 bg-indigo/20 border border-indigo/30 text-indigo rounded-lg text-xs font-medium hover:bg-indigo/30 transition">
          Consolidate
        </button>
      </div>

      <div className="glass rounded-xl overflow-hidden">
        <div className="grid grid-cols-12 gap-2 px-4 py-2 text-xs text-gray-500 border-b border-white/5 font-medium">
          <div className="col-span-5">Content</div>
          <div className="col-span-2">Tags</div>
          <div className="col-span-1 text-center">Score</div>
          <div className="col-span-1 text-center">Imp.</div>
          <div className="col-span-1 text-center">Hits</div>
          <div className="col-span-2 text-right">Actions</div>
        </div>
        <div className="max-h-[400px] overflow-y-auto scrollbar-thin">
          {filtered.map(m => (
            <div key={m.id} className="memory-row grid grid-cols-12 gap-2 px-4 py-3 border-b border-white/5 items-center text-sm">
              <div className="col-span-5 text-gray-300 truncate" title={m.content}>{sanitize(m.content)}</div>
              <div className="col-span-2 flex gap-1 flex-wrap">
                {(m.tags || []).map(t => <span key={t} className="px-1.5 py-0.5 bg-mnemo/15 text-mnemo text-[10px] rounded">{sanitize(t)}</span>)}
              </div>
              <div className="col-span-1 text-center font-mono text-xs text-teal">{(m.score || 0).toFixed(2)}</div>
              <div className="col-span-1 text-center font-mono text-xs">{(m.importance || 0).toFixed(2)}</div>
              <div className="col-span-1 text-center font-mono text-xs text-gray-400">{m.accessCount || 0}</div>
              <div className="col-span-2 flex gap-1 justify-end">
                <button onClick={() => handleReinforce(m.id)}
                  className="px-2 py-1 bg-teal/15 text-teal text-[10px] rounded hover:bg-teal/25 transition" title="Reinforce +0.1">+</button>
                <button onClick={() => handleForget(m.id)}
                  className="px-2 py-1 bg-red-500/15 text-red-400 text-[10px] rounded hover:bg-red-500/25 transition" title="Forget">x</button>
              </div>
            </div>
          ))}
          {filtered.length === 0 && <div className="px-4 py-8 text-center text-gray-500 text-sm">No memories found</div>}
        </div>
      </div>
    </div>
  );
}

function PaymentPanel({ history, onRefresh }) {
  const [amount, setAmount] = useState('');
  const [reason, setReason] = useState('');

  const handleCharge = async () => {
    const a = parseFloat(amount);
    if (!a || a <= 0 || !reason.trim()) return;
    await api.post('/api/charge', { amount: a, reason: reason.trim() });
    setAmount(''); setReason('');
    onRefresh();
  };

  const handleSettle = async (txId) => { await api.post('/api/settle', { txId }); onRefresh(); };
  const handleRefund = async (txId) => { await api.post('/api/refund', { txId }); onRefresh(); };

  const statusColors = { pending: 'text-amber-400 bg-amber-400/10', completed: 'text-teal bg-teal/10', refunded: 'text-red-400 bg-red-400/10' };

  return (
    <div className="space-y-4 fade-in">
      <div className="glass rounded-xl p-4">
        <h3 className="text-sm font-semibold text-gray-300 mb-3">Create Charge (Escrow)</h3>
        <div className="flex gap-2">
          <input className="w-28 bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none"
            type="number" step="0.01" min="0" placeholder="$0.00" value={amount} onChange={e => setAmount(e.target.value)} />
          <input className="flex-1 bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none"
            placeholder="Reason (e.g., Code review)" value={reason} onChange={e => setReason(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') handleCharge(); }} />
          <button onClick={handleCharge} className="px-4 py-2 bg-mnemo text-white rounded-lg text-sm font-medium hover:bg-blue-600 transition">
            Charge
          </button>
        </div>
      </div>

      <div className="glass rounded-xl overflow-hidden">
        <div className="grid grid-cols-12 gap-2 px-4 py-2 text-xs text-gray-500 border-b border-white/5 font-medium">
          <div className="col-span-2">ID</div>
          <div className="col-span-2">Amount</div>
          <div className="col-span-3">Reason</div>
          <div className="col-span-2">Status</div>
          <div className="col-span-1">Time</div>
          <div className="col-span-2 text-right">Actions</div>
        </div>
        <div className="max-h-[400px] overflow-y-auto scrollbar-thin">
          {(history || []).map(tx => (
            <div key={tx.id} className="memory-row grid grid-cols-12 gap-2 px-4 py-3 border-b border-white/5 items-center text-sm">
              <div className="col-span-2 font-mono text-xs text-gray-400">{(tx.id || '').slice(0, 8)}</div>
              <div className="col-span-2 font-mono text-white font-medium">${(tx.amount || 0).toFixed(2)}</div>
              <div className="col-span-3 text-gray-300 truncate">{sanitize(tx.reason)}</div>
              <div className="col-span-2">
                <span className={`px-2 py-0.5 rounded text-[10px] font-medium ${statusColors[tx.status] || ''}`}>{tx.status}</span>
              </div>
              <div className="col-span-1 text-xs text-gray-500">{tx.createdAt ? new Date(tx.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''}</div>
              <div className="col-span-2 flex gap-1 justify-end">
                {tx.status === 'pending' && (
                  <>
                    <button onClick={() => handleSettle(tx.id)} className="px-2 py-1 bg-teal/15 text-teal text-[10px] rounded hover:bg-teal/25">Settle</button>
                    <button onClick={() => handleRefund(tx.id)} className="px-2 py-1 bg-red-500/15 text-red-400 text-[10px] rounded hover:bg-red-500/25">Refund</button>
                  </>
                )}
                {tx.status === 'completed' && (
                  <button onClick={() => handleRefund(tx.id)} className="px-2 py-1 bg-red-500/15 text-red-400 text-[10px] rounded hover:bg-red-500/25">Refund</button>
                )}
              </div>
            </div>
          ))}
          {(!history || history.length === 0) && <div className="px-4 py-8 text-center text-gray-500 text-sm">No transactions yet</div>}
        </div>
      </div>
    </div>
  );
}

function AuditPanel({ logs }) {
  const actionColors = {
    'memory:stored': 'text-teal', 'memory:deleted': 'text-red-400', 'memory:reinforced': 'text-mnemo',
    'memory:consolidated': 'text-indigo', 'payment:pending': 'text-amber-400',
    'payment:completed': 'text-teal', 'payment:refunded': 'text-red-400'
  };
  return (
    <div className="fade-in glass rounded-xl overflow-hidden">
      <div className="max-h-[500px] overflow-y-auto scrollbar-thin">
        {(logs || []).map((e, i) => (
          <div key={e.id || i} className="px-4 py-2.5 border-b border-white/5 flex items-start gap-3 text-sm">
            <span className="text-[10px] text-gray-500 font-mono whitespace-nowrap mt-0.5">
              {e.createdAt ? new Date(e.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : ''}
            </span>
            <span className={`text-xs font-mono ${actionColors[e.action] || 'text-gray-400'}`}>{e.action}</span>
            <span className="text-xs text-gray-400 truncate">{JSON.stringify(e.details || {}).slice(0, 120)}</span>
          </div>
        ))}
        {(!logs || logs.length === 0) && <div className="px-4 py-8 text-center text-gray-500">No audit entries yet</div>}
      </div>
    </div>
  );
}

function ConsolePanel({ overview, accountId, onAccountChange, onRefresh }) {
  const onboarding = overview?.onboarding?.tasks || [];
  const usage = overview?.usage || {};
  const session = overview?.session;
  return (
    <div className="space-y-4 fade-in">
      <div className="glass rounded-xl p-5">
        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div>
            <p className="text-xs uppercase tracking-wider text-teal mb-2">Operator Console</p>
            <h2 className="text-2xl font-bold text-white">Brain, wallet, and audit trail</h2>
            <p className="text-sm text-gray-400 mt-2">{overview?.positioning || 'MnemoPay control plane for AI agents that handle money.'}</p>
            <p className="text-xs text-gray-500 mt-2">Session: {session?.authenticated ? `signed in as ${sanitize(session.session?.accountId || accountId)}` : 'dev header fallback'}</p>
          </div>
          <div className="flex gap-2 items-center">
            <input className="bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none"
              value={accountId} onChange={e => onAccountChange(e.target.value)} placeholder="account id" />
            <button onClick={onRefresh} className="px-3 py-2 bg-teal text-white rounded-lg text-sm font-medium hover:bg-teal-600 transition">Refresh</button>
          </div>
        </div>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        <StatCard label="Brain Writes" value={usage.brainWrites || 0} sub="Hosted memories" color="blue" icon="B" />
        <StatCard label="Brain Queries" value={usage.brainQueries || 0} sub="Recall calls" color="teal" icon="Q" />
        <StatCard label="Rail Holds" value={usage.railCharges || 0} sub="Charges created" color="amber" icon="$" />
        <StatCard label="API Keys" value={(overview?.apiKeys || []).length} sub={`${overview?.brain?.memories || 0} brain memories`} color="purple" icon="K" />
      </div>

      <div className="glass rounded-xl p-5">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-sm font-semibold text-gray-300">Onboarding</h3>
          <span className={`status-badge ${overview?.onboarding?.complete ? 'status-merged' : 'status-pr-open'}`}>{overview?.onboarding?.complete ? 'Complete' : 'In progress'}</span>
        </div>
        <div className="grid md:grid-cols-5 gap-2">
          {onboarding.map(task => (
            <div key={task.id} className={`rounded-lg p-3 border ${task.done ? 'border-teal/30 bg-teal/10' : 'border-white/10 bg-white/5'}`}>
              <div className={`text-xs font-medium ${task.done ? 'text-teal' : 'text-gray-300'}`}>{task.done ? 'Done' : 'Open'}</div>
              <div className="text-xs text-gray-400 mt-1">{task.label}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function DeveloperPanel({ apiKeys, onRefresh }) {
  const [name, setName] = useState('default');
  const [secret, setSecret] = useState('');

  const createKey = async () => {
    const payload = await api.post('/api/v1/developer/api-keys', { name });
    setSecret(payload.secret || '');
    setName('default');
    onRefresh();
  };

  const revokeKey = async (id) => {
    await api.post(`/api/v1/developer/api-keys/${id}/revoke`, {});
    onRefresh();
  };

  return (
    <div className="space-y-4 fade-in">
      <div className="glass rounded-xl p-4">
        <h3 className="text-sm font-semibold text-gray-300 mb-3">Create API Key</h3>
        <div className="flex gap-2">
          <input className="flex-1 bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none"
            value={name} onChange={e => setName(e.target.value)} placeholder="prod-agent" />
          <button onClick={createKey} className="px-4 py-2 bg-teal text-white rounded-lg text-sm font-medium hover:bg-teal-600 transition">Create</button>
        </div>
        {secret && (
          <div className="mt-3 rounded-lg border border-amber-400/25 bg-amber-400/10 p-3">
            <p className="text-xs text-amber-300 mb-2">Save this secret now. It will not be shown again.</p>
            <code className="text-xs text-white break-all">{secret}</code>
          </div>
        )}
      </div>

      <div className="glass rounded-xl overflow-hidden">
        {(apiKeys || []).map(key => (
          <div key={key.id} className="px-4 py-3 border-b border-white/5 flex items-center justify-between gap-3">
            <div>
              <div className="text-sm text-white font-medium">{sanitize(key.name)}</div>
              <div className="text-xs text-gray-500 font-mono">{key.prefix}... · {key.createdAt ? new Date(key.createdAt).toLocaleString() : ''}</div>
            </div>
            <button onClick={() => revokeKey(key.id)} disabled={!!key.revokedAt}
              className="px-3 py-1.5 bg-red-500/15 text-red-300 rounded-lg text-xs disabled:opacity-40">
              {key.revokedAt ? 'Revoked' : 'Revoke'}
            </button>
          </div>
        ))}
        {(!apiKeys || apiKeys.length === 0) && <div className="px-4 py-8 text-center text-gray-500">No API keys yet</div>}
      </div>
    </div>
  );
}

function BrainPanel({ onRefresh }) {
  const [namespace, setNamespace] = useState('default');
  const [content, setContent] = useState('');
  const [query, setQuery] = useState('');
  const [results, setResults] = useState([]);
  const [exported, setExported] = useState(null);
  const [graph, setGraph] = useState(null);
  const [trace, setTrace] = useState(null);
  const [status, setStatus] = useState('');

  const storeMemory = async () => {
    if (!content.trim()) return;
    await api.post('/api/v1/brain/memories', { namespace, content, tags: ['dashboard'], importance: 0.75 });
    setContent('');
    onRefresh();
  };

  const runQuery = async () => {
    if (!query.trim()) return;
    const payload = await api.post('/api/v1/brain/query', { namespace, query, limit: 6 });
    setResults(payload.results || []);
    setStatus(`Found ${(payload.results || []).length} matching memories.`);
    onRefresh();
  };

  const reason = async () => {
    if (!query.trim()) return;
    const payload = await api.post('/api/v1/brain/reason', { namespace, query, limit: 6 });
    setResults(payload.evidence || []);
    setTrace(payload);
    setStatus(`Reasoned with ${payload.evidence?.length || 0} memories at confidence ${payload.confidence || 0}.`);
    onRefresh();
  };

  const exportNamespace = async () => {
    const payload = await api.get(`/api/v1/brain/namespaces/${encodeURIComponent(namespace)}/export`);
    setExported(payload);
    setStatus(`Exported ${(payload.memories || []).length} memories from ${payload.namespace}.`);
    onRefresh();
  };

  const loadGraph = async () => {
    const payload = await api.get(`/api/v1/brain/namespaces/${encodeURIComponent(namespace)}/graph`);
    setGraph(payload);
    setStatus(`Loaded graph: ${payload.stats?.entities || 0} entities, ${payload.stats?.edges || 0} edges.`);
    onRefresh();
  };

  const rebuildGraph = async () => {
    const payload = await api.post(`/api/v1/brain/namespaces/${encodeURIComponent(namespace)}/enrich`, {});
    setGraph(payload);
    setStatus(`Rebuilt graph: ${payload.stats?.entities || 0} entities, ${payload.stats?.edges || 0} edges.`);
    onRefresh();
  };

  const downloadExport = () => {
    if (!exported) return;
    const blob = new Blob([JSON.stringify(exported, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `${exported.namespace || namespace}-mnemopay-export.json`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  };

  const deleteNamespace = async () => {
    const target = namespace.trim();
    if (!target) return;
    if (!window.confirm(`Delete namespace "${target}" for this account? Export it first if you need a copy.`)) return;
    const payload = await api.del(`/api/v1/brain/namespaces/${encodeURIComponent(target)}`);
    setResults([]);
    setExported(null);
    setStatus(`Deleted ${payload.deleted || 0} memories from ${target}.`);
    onRefresh();
  };

  return (
    <div className="space-y-4 fade-in">
      <div className="glass rounded-xl p-4">
        <div className="grid md:grid-cols-3 gap-3">
          <input className="bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none"
            value={namespace} onChange={e => setNamespace(e.target.value)} placeholder="namespace" />
          <input className="md:col-span-2 bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none"
            value={content} onChange={e => setContent(e.target.value)} placeholder="Memory to store" />
        </div>
        <div className="flex flex-wrap gap-2 mt-3">
          <button onClick={storeMemory} className="px-4 py-2 bg-teal text-white rounded-lg text-sm font-medium">Store Memory</button>
          <button onClick={exportNamespace} className="px-4 py-2 bg-white/5 border border-white/10 text-gray-300 rounded-lg text-sm">Export Namespace</button>
          <button onClick={loadGraph} className="px-4 py-2 bg-white/5 border border-white/10 text-gray-300 rounded-lg text-sm">Load Graph</button>
          <button onClick={rebuildGraph} className="px-4 py-2 bg-white/5 border border-white/10 text-gray-300 rounded-lg text-sm">Rebuild Graph</button>
          <button onClick={downloadExport} disabled={!exported} className="px-4 py-2 bg-white/5 border border-white/10 text-gray-300 rounded-lg text-sm disabled:opacity-40">Download JSON</button>
          <button onClick={deleteNamespace} className="px-4 py-2 bg-red-500/15 border border-red-500/25 text-red-200 rounded-lg text-sm">Delete Namespace</button>
        </div>
        {status && <p className="mt-3 text-xs text-gray-500">{sanitize(status)}</p>}
      </div>

      <div className="glass rounded-xl p-4">
        <div className="flex gap-2">
          <input className="flex-1 bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none"
            value={query} onChange={e => setQuery(e.target.value)} placeholder="Ask this namespace..." onKeyDown={e => { if (e.key === 'Enter') runQuery(); }} />
          <button onClick={runQuery} className="px-4 py-2 bg-mnemo text-white rounded-lg text-sm font-medium">Query</button>
          <button onClick={reason} className="px-4 py-2 bg-teal text-white rounded-lg text-sm font-medium">Reason</button>
        </div>
        <div className="mt-4 space-y-2">
          {results.map(r => (
            <div key={r.id || r.memoryId} className="rounded-lg border border-white/10 bg-white/5 p-3">
              <div className="text-xs text-teal font-mono mb-1">{r.id || r.memoryId} · score {(r.score || 0).toFixed(2)}</div>
              <div className="text-sm text-gray-300">{sanitize(r.content)}</div>
            </div>
          ))}
          {results.length === 0 && <p className="text-sm text-gray-500">No query results yet.</p>}
        </div>
      </div>

      {trace && (
        <div className="glass rounded-xl p-4">
          <div className="flex items-center justify-between gap-3 mb-3">
            <div>
              <h3 className="text-sm font-semibold text-gray-300">Reasoning Trace</h3>
              <p className="text-xs text-gray-500 mt-1">{sanitize(trace.namespace)} · confidence {trace.confidence}</p>
            </div>
            <span className="text-xs text-teal font-mono">{sanitize(trace.mode)}</span>
          </div>
          <p className="text-sm text-gray-300 mb-3">{sanitize(trace.answer)}</p>
          <div className="grid md:grid-cols-2 gap-3">
            {(trace.steps || []).map(step => (
              <div key={step.name} className="rounded-lg border border-white/10 bg-white/5 p-3">
                <div className="text-xs text-teal uppercase tracking-wide">{sanitize(step.name)}</div>
                <div className="text-sm text-gray-400 mt-1">{sanitize(step.detail)}</div>
              </div>
            ))}
          </div>
          {(trace.entities || []).length > 0 && (
            <div className="mt-3 flex flex-wrap gap-2">
              {(trace.entities || []).slice(0, 10).map(entity => (
                <span key={entity.id} className="px-2 py-1 rounded-md border border-white/10 bg-white/5 text-xs text-gray-300">{sanitize(entity.name)}</span>
              ))}
            </div>
          )}
        </div>
      )}

      {graph && (
        <div className="glass rounded-xl p-4">
          <div className="flex items-center justify-between gap-3 mb-3">
            <div>
              <h3 className="text-sm font-semibold text-gray-300">Knowledge Graph: {sanitize(graph.namespace)}</h3>
              <p className="text-xs text-gray-500 mt-1">{graph.stats?.entities || 0} entities · {graph.stats?.edges || 0} edges · {graph.stats?.memories || 0} memories</p>
            </div>
            <button onClick={rebuildGraph} className="px-3 py-1.5 bg-white/5 border border-white/10 text-gray-300 rounded-lg text-xs">Rebuild</button>
          </div>
          <div className="grid md:grid-cols-2 gap-4">
            <div className="rounded-lg border border-white/10 overflow-hidden">
              {(graph.entities || []).slice(0, 12).map(entity => (
                <div key={entity.id} className="px-3 py-2 border-b border-white/5 flex items-center justify-between gap-3">
                  <div>
                    <div className="text-sm text-white">{sanitize(entity.name)}</div>
                    <div className="text-xs text-gray-500">{sanitize(entity.type)} · {entity.mentionCount || 0} mentions</div>
                  </div>
                  <span className="text-[10px] text-gray-500 font-mono">{entity.id.slice(0, 10)}</span>
                </div>
              ))}
              {(!graph.entities || graph.entities.length === 0) && <div className="px-3 py-6 text-center text-sm text-gray-500">No entities yet.</div>}
            </div>
            <div className="rounded-lg border border-white/10 overflow-hidden">
              {(graph.edges || []).slice(0, 12).map(edge => (
                <div key={edge.id} className="px-3 py-2 border-b border-white/5">
                  <div className="text-xs text-teal font-mono">{sanitize(edge.predicate)}</div>
                  <div className="text-xs text-gray-500 mt-1">{edge.subjectId.slice(0, 10)} -> {edge.objectId.slice(0, 10)} · weight {edge.weight || 1}</div>
                </div>
              ))}
              {(!graph.edges || graph.edges.length === 0) && <div className="px-3 py-6 text-center text-sm text-gray-500">No edges yet.</div>}
            </div>
          </div>
        </div>
      )}

      {exported && (
        <div className="glass rounded-xl p-4">
          <h3 className="text-sm font-semibold text-gray-300 mb-2">Export: {sanitize(exported.namespace)}</h3>
          <div className="flex items-center justify-between gap-3 mb-3">
            <p className="text-xs text-gray-500">{(exported.memories || []).length} memories exported</p>
            <button onClick={downloadExport} className="px-3 py-1.5 bg-white/5 border border-white/10 text-gray-300 rounded-lg text-xs">Download JSON</button>
          </div>
          <pre className="text-xs text-gray-300 bg-black/30 rounded-lg p-3 overflow-auto max-h-56">{JSON.stringify(exported.memories || [], null, 2)}</pre>
        </div>
      )}
    </div>
  );
}

function BillingPanel({ overview, onRefresh }) {
  const tasks = overview?.onboarding?.tasks || [];
  const billing = overview?.billing || overview?.onboarding?.billing || {};
  const metering = overview?.metering || {};
  const missions = metering.missions || {};
  const [plan, setPlan] = useState(billing.plan || overview?.plan || 'pro');
  const [interval, setInterval] = useState(billing.interval || 'monthly');
  const [provisionedSecret, setProvisionedSecret] = useState('');
  const [usageExport, setUsageExport] = useState(null);
  const [status, setStatus] = useState('');

  useEffect(() => {
    setPlan(billing.plan || overview?.plan || 'pro');
    setInterval(billing.interval || 'monthly');
  }, [billing.plan, billing.interval, overview?.plan]);

  const provision = async () => {
    const payload = await api.post('/api/v1/billing/provision', {
      plan,
      interval,
      source: 'dashboard',
      createApiKey: true,
      apiKeyName: `${plan}-default`,
    });
    setProvisionedSecret(payload.apiKey?.secret || '');
    setStatus(`Provisioned ${payload.account?.plan || plan} for ${payload.accountId}.`);
    onRefresh();
  };

  const exportUsage = async () => {
    const payload = await api.get('/api/v1/usage/export');
    setUsageExport(payload);
    setStatus(`Exported usage report with ${(payload.events || []).length} audit events.`);
    onRefresh();
  };

  const openCheckout = async () => {
    if (!['pro', 'team'].includes(plan) || !['monthly', 'yearly'].includes(interval)) {
      setStatus('Live checkout is available for Pro/Team monthly or yearly plans.');
      return;
    }
    const payload = await api.post('/api/v1/billing/checkout/session', { plan, interval });
    setStatus(`Opening Stripe Checkout for ${payload.tier} ${payload.interval}.`);
    if (payload.url) window.location.href = payload.url;
  };

  const openPortal = async () => {
    const payload = await api.post('/api/v1/billing/portal/session', {});
    setStatus('Opening Stripe customer portal.');
    if (payload.url) window.location.href = payload.url;
  };

  const missionLimit = missions.limit === 'unlimited' || missions.limit === 'custom' ? missions.limit : (missions.limit || 0);
  const missionPct = typeof missionLimit === 'number' && missionLimit > 0
    ? Math.min(100, Math.round(((missions.used || 0) / missionLimit) * 100))
    : 0;

  return (
    <div className="space-y-4 fade-in">
      <div className="glass rounded-xl p-5">
        <p className="text-xs uppercase tracking-wider text-teal mb-2">Billing and Provisioning</p>
        <h2 className="text-2xl font-bold text-white">{(overview?.plan || 'free').toUpperCase()} plan</h2>
        <p className="text-sm text-gray-400 mt-2">Provisioning now creates real account state: plan, default hosted brain namespace, first API key, usage counters, and audit event.</p>
        <div className="grid md:grid-cols-5 gap-3 mt-4">
          <select value={plan} onChange={e => setPlan(e.target.value)}
            className="bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:outline-none">
            <option value="free">Free</option>
            <option value="pro">Pro</option>
            <option value="team">Team</option>
            <option value="enterprise">Enterprise</option>
          </select>
          <select value={interval} onChange={e => setInterval(e.target.value)}
            className="bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:outline-none">
            <option value="monthly">Monthly</option>
            <option value="yearly">Yearly</option>
            <option value="custom">Custom</option>
          </select>
          <button onClick={provision} className="px-4 py-2 bg-teal text-white rounded-lg text-sm font-medium hover:bg-teal-600 transition">Provision Account</button>
          <button onClick={openCheckout} className="px-4 py-2 bg-mnemo text-white rounded-lg text-sm font-medium">Stripe Checkout</button>
          <button onClick={openPortal} className="px-4 py-2 bg-white/5 border border-white/10 text-gray-300 rounded-lg text-sm">Customer Portal</button>
          <button onClick={exportUsage} className="px-4 py-2 bg-white/5 border border-white/10 text-gray-300 rounded-lg text-sm">Export Usage</button>
        </div>
        {status && <p className="text-xs text-gray-500 mt-3">{sanitize(status)}</p>}
        {provisionedSecret && (
          <div className="mt-3 rounded-lg border border-amber-400/25 bg-amber-400/10 p-3">
            <p className="text-xs text-amber-300 mb-2">First API key created. Save this secret now.</p>
            <code className="text-xs text-white break-all">{provisionedSecret}</code>
          </div>
        )}
      </div>
      <div className="glass rounded-xl p-5">
        <div className="flex items-center justify-between gap-3 mb-3">
          <div>
            <h3 className="text-sm font-semibold text-gray-300">Usage Meter</h3>
            <p className="text-xs text-gray-500 mt-1">Period: {sanitize(metering.period || 'lifetime-prototype')}</p>
          </div>
          <button onClick={onRefresh} className="px-3 py-1.5 bg-white/5 border border-white/10 text-gray-300 rounded-lg text-xs">Refresh</button>
        </div>
        <div className="grid md:grid-cols-4 gap-3">
          <div className="rounded-lg border border-white/10 bg-white/5 p-3">
            <div className="text-xs text-gray-500">Missions</div>
            <div className="text-xl font-bold text-white mt-1">{missions.used || 0}<span className="text-xs text-gray-500"> / {missionLimit}</span></div>
            {typeof missionLimit === 'number' && (
              <div className="h-1.5 rounded-full bg-white/10 mt-3 overflow-hidden">
                <div className="h-full bg-teal" style={{ width: `${missionPct}%` }}></div>
              </div>
            )}
          </div>
          <div className="rounded-lg border border-white/10 bg-white/5 p-3">
            <div className="text-xs text-gray-500">LLM cap</div>
            <div className="text-xl font-bold text-white mt-1">{metering.llmCapCents == null ? 'Custom' : `$${(metering.llmCapCents / 100).toFixed(0)}`}</div>
          </div>
          <div className="rounded-lg border border-white/10 bg-white/5 p-3">
            <div className="text-xs text-gray-500">Seats</div>
            <div className="text-xl font-bold text-white mt-1">{metering.seats || 1}</div>
          </div>
          <div className={`rounded-lg border p-3 ${missions.overLimit ? 'border-red-500/25 bg-red-500/10' : 'border-teal/30 bg-teal/10'}`}>
            <div className="text-xs text-gray-500">Plan gate</div>
            <div className={`text-sm font-semibold mt-2 ${missions.overLimit ? 'text-red-200' : 'text-teal'}`}>{missions.overLimit ? 'Limit reached' : 'Active'}</div>
          </div>
        </div>
        {usageExport && (
          <pre className="text-xs text-gray-300 bg-black/30 rounded-lg p-3 overflow-auto max-h-44 mt-4">{JSON.stringify(usageExport.report || {}, null, 2)}</pre>
        )}
      </div>
      <div className="grid md:grid-cols-5 gap-3">
        {tasks.map(task => (
          <div key={task.id} className={`rounded-xl border p-4 ${task.done ? 'border-teal/30 bg-teal/10' : 'border-white/10 bg-white/5'}`}>
            <div className={`text-xs font-semibold ${task.done ? 'text-teal' : 'text-gray-300'}`}>{task.done ? 'Complete' : 'Pending'}</div>
            <p className="text-sm text-gray-400 mt-2">{task.label}</p>
          </div>
        ))}
      </div>
      <button onClick={onRefresh} className="px-4 py-2 bg-white/5 border border-white/10 text-gray-300 rounded-lg text-sm">Refresh billing state</button>
    </div>
  );
}

function SessionPanel({ session, accountId, members = [], onLogin, onLogout, onRefresh }) {
  const [nextAccount, setNextAccount] = useState(accountId || 'default');
  const [email, setEmail] = useState('');
  const [authCode, setAuthCode] = useState('');
  const [challenge, setChallenge] = useState(null);
  const [status, setStatus] = useState('');
  const [memberEmail, setMemberEmail] = useState('');
  const [memberRole, setMemberRole] = useState('member');

  useEffect(() => {
    setNextAccount(accountId || 'default');
  }, [accountId]);

  const requestCode = async () => {
    const payload = await api.post('/api/v1/auth/challenge', { accountId: nextAccount, email });
    setChallenge(payload.challenge);
    setAuthCode(payload.challenge?.devCode || '');
    setStatus(payload.challenge?.devCode ? `Dev code ready: ${payload.challenge.devCode}` : `Code sent to ${payload.challenge?.email || email}.`);
  };

  const verifyCode = async () => {
    if (!challenge?.id || !authCode.trim()) return;
    await onLogin(challenge.id, authCode);
    setStatus('Signed in with passwordless code.');
    setChallenge(null);
    setAuthCode('');
  };

  const addMember = async () => {
    if (!memberEmail.trim()) return;
    await api.post('/api/v1/auth/members', { email: memberEmail, role: memberRole, source: 'dashboard' });
    setMemberEmail('');
    onRefresh();
  };

  return (
    <div className="fade-in glass rounded-xl p-5">
      <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <p className="text-xs uppercase tracking-wider text-teal mb-2">Console Session</p>
          <h3 className="text-xl font-bold text-white">{session?.authenticated ? 'Signed session active' : 'Passwordless console sign-in'}</h3>
          <p className="text-sm text-gray-400 mt-2">Request a short-lived email code, then verify it to bind dashboard actions to an account.</p>
        </div>
        {session?.authenticated && (
          <button onClick={onLogout} className="px-4 py-2 bg-red-500/15 border border-red-500/25 text-red-200 rounded-lg text-sm">Sign out</button>
        )}
      </div>
      <div className="grid md:grid-cols-4 gap-3 mt-4">
        <input className="bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none"
          value={nextAccount} onChange={e => setNextAccount(e.target.value)} placeholder="account id" />
        <input className="bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none"
          value={email} onChange={e => setEmail(e.target.value)} placeholder="email" />
        <button onClick={requestCode} className="px-4 py-2 bg-white/5 border border-white/10 text-gray-300 rounded-lg text-sm">Request Code</button>
        <input className="bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none"
          value={authCode} onChange={e => setAuthCode(e.target.value)} placeholder="6-digit code" />
        <button onClick={verifyCode} disabled={!challenge?.id}
          className="md:col-span-4 px-4 py-2 bg-teal text-white rounded-lg text-sm font-medium disabled:opacity-40">{session?.authenticated ? 'Switch Account' : 'Verify and Sign In'}</button>
      </div>
      {status && <p className="text-xs text-gray-500 mt-3">{sanitize(status)}</p>}
      {session?.authenticated && (
        <div className="mt-4 grid md:grid-cols-3 gap-3 text-xs">
          <div className="rounded-lg bg-white/5 border border-white/10 p-3">
            <div className="text-gray-500">Account</div>
            <div className="text-white font-mono mt-1">{sanitize(session.session?.accountId || '')}</div>
          </div>
          <div className="rounded-lg bg-white/5 border border-white/10 p-3">
            <div className="text-gray-500">Created</div>
            <div className="text-gray-300 mt-1">{session.session?.createdAt ? new Date(session.session.createdAt).toLocaleString() : ''}</div>
          </div>
          <div className="rounded-lg bg-white/5 border border-white/10 p-3">
            <div className="text-gray-500">Expires</div>
            <div className="text-gray-300 mt-1">{session.session?.expiresAt ? new Date(session.session.expiresAt).toLocaleString() : ''}</div>
          </div>
        </div>
      )}
      <div className="mt-5 border-t border-white/10 pt-4">
        <div className="flex items-center justify-between gap-3 mb-3">
          <h4 className="text-sm font-semibold text-gray-300">Account Members</h4>
          <span className="text-xs text-gray-500">{members.length} total</span>
        </div>
        <div className="grid md:grid-cols-3 gap-3 mb-3">
          <input className="bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none"
            value={memberEmail} onChange={e => setMemberEmail(e.target.value)} placeholder="member email" />
          <select value={memberRole} onChange={e => setMemberRole(e.target.value)}
            className="bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:outline-none">
            <option value="admin">Admin</option>
            <option value="member">Member</option>
            <option value="viewer">Viewer</option>
          </select>
          <button onClick={addMember} disabled={!session?.authenticated}
            className="px-4 py-2 bg-white/5 border border-white/10 text-gray-300 rounded-lg text-sm disabled:opacity-40">Add Member</button>
        </div>
        <div className="rounded-xl border border-white/10 overflow-hidden">
          {members.map(member => (
            <div key={member.id} className="px-4 py-3 border-b border-white/5 flex items-center justify-between gap-3">
              <div>
                <div className="text-sm text-white">{sanitize(member.email)}</div>
                <div className="text-xs text-gray-500">{member.createdAt ? new Date(member.createdAt).toLocaleString() : ''}</div>
              </div>
              <span className="status-badge status-pr-open">{sanitize(member.role)}</span>
            </div>
          ))}
          {members.length === 0 && <div className="px-4 py-6 text-sm text-gray-500 text-center">No members yet.</div>}
        </div>
      </div>
    </div>
  );
}

  const statusClass = `status-${repo.status}`;

    <div className="repo-card glass rounded-xl p-5 space-y-3">
      <div className="flex items-start justify-between">
        <div>
          <a href={`https://github.com/${repo.name}`} target="_blank" rel="noopener noreferrer"
            className="text-white font-semibold hover:text-teal transition text-sm">{repo.name}</a>
          <div className="text-[10px] text-gray-500 mt-0.5 font-mono">{repo.branch}</div>
        </div>
        <span className={`status-badge ${statusClass}`}>{statusLabel[repo.status] || repo.status}</span>
      </div>

      {repo.description && <p className="text-xs text-gray-400 line-clamp-2">{sanitize(repo.description)}</p>}

      <div className="flex items-center gap-4 text-xs text-gray-500">
        {repo.upstreamStars > 0 && (
          <span title="Upstream stars">
            <span className="text-amber-400">&#9733;</span> {repo.upstreamStars.toLocaleString()}
          </span>
        )}
        {repo.updatedAt && (
          <span>Updated {new Date(repo.updatedAt).toLocaleDateString()}</span>
        )}
      </div>

      {repo.pr && (
        <div className="glass rounded-lg p-3 mt-2">
          <div className="flex items-center gap-2">
            <span className="text-teal text-xs font-mono">#{repo.pr.number}</span>
            <a href={repo.pr.url} target="_blank" rel="noopener noreferrer"
              className="text-xs text-gray-300 hover:text-white transition truncate">
              {sanitize(repo.pr.title)}
            </a>
          </div>
          <div className="text-[10px] text-gray-500 mt-1">
            Opened {repo.pr.createdAt ? new Date(repo.pr.createdAt).toLocaleDateString() : 'recently'}
          </div>
        </div>
      )}

      {repo.status === 'error' && (
        <div className="text-xs text-red-400 bg-red-400/5 rounded-lg p-2">
          {sanitize(repo.error || 'Failed to fetch status')}
        </div>
      )}

      <div className="flex gap-2 pt-1">
        <a href={`https://github.com/${repo.fork}`} target="_blank" rel="noopener noreferrer"
          className="text-[10px] px-2 py-1 bg-white/5 border border-white/10 rounded text-gray-400 hover:text-white transition">
          Fork
        </a>
        <a href={`https://github.com/${repo.name}`} target="_blank" rel="noopener noreferrer"
          className="text-[10px] px-2 py-1 bg-white/5 border border-white/10 rounded text-gray-400 hover:text-white transition">
          Upstream
        </a>
        {repo.pr && repo.pr.url && (
          <a href={repo.pr.url} target="_blank" rel="noopener noreferrer"
            className="text-[10px] px-2 py-1 bg-teal/15 border border-teal/20 rounded text-teal hover:bg-teal/25 transition">
            View PR
          </a>
        )}
      </div>
    </div>
  );
}

function ReposPanel({ repos, loading, onRefresh }) {
  const prOpen = (repos || []).filter(r => r.status === 'pr-open').length;
  const merged = (repos || []).filter(r => r.status === 'merged').length;
  const totalStars = (repos || []).reduce((sum, r) => sum + (r.upstreamStars || 0), 0);

  return (
    <div className="space-y-4 fade-in">
      <div className="flex items-center justify-between">
        <div className="flex gap-4 text-xs text-gray-400">
          <span><span className="text-teal font-bold">{prOpen}</span> PRs Open</span>
          <span><span className="text-purple-400 font-bold">{merged}</span> Merged</span>
          <span><span className="text-amber-400">&#9733;</span> {totalStars.toLocaleString()} total upstream stars</span>
        </div>
        <button onClick={onRefresh} disabled={loading}
          className="px-3 py-1.5 bg-white/5 border border-white/10 rounded-lg text-xs text-gray-400 hover:text-white transition disabled:opacity-50">
          {loading ? 'Refreshing...' : 'Refresh'}
        </button>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        {(repos || []).map(repo => <RepoCard key={repo.name} repo={repo} />)}
      </div>

      {(!repos || repos.length === 0) && !loading && (
        <div className="glass rounded-xl p-8 text-center text-gray-500">No repos being monitored</div>
      )}
      {loading && (!repos || repos.length === 0) && (
        <div className="glass rounded-xl p-8 text-center text-gray-500">Loading repo status from GitHub...</div>
      )}
    </div>
  );
}

// ── Main Dashboard ────────────────────────────────────────────────────────

function Dashboard() {
  const [tab, setTab] = useState('console');
  const [accountId, setAccountIdState] = useState(getAccountId());
  const [connected, setConnected] = useState(false);
  const [profile, setProfile] = useState({ wallet: 0, reputation: 0.5, memoriesCount: 0, transactionsCount: 0 });
  const [overview, setOverview] = useState(null);
  const [memories, setMemories] = useState([]);
  const [history, setHistory] = useState([]);
  const [logs, setLogs] = useState([]);
  const [controlEvents, setControlEvents] = useState([]);
  const [session, setSession] = useState(null);
  const [repos, setRepos] = useState([]);
  const [reposLoading, setReposLoading] = useState(false);
  const [lastUpdate, setLastUpdate] = useState(null);

  const fetchAll = useCallback(async () => {
    try {
      // Every data route now requires a signed session; only ask for it once
      // we know there is one, otherwise show the sign-in form.
      const activeSession = await api.get('/api/v1/auth/session');
      if (!activeSession?.authenticated) {
        setSession(activeSession);
        setOverview(null);
        setTab('session');
        setConnected(true);
        setLastUpdate(new Date());
        return;
      }
      const [prof, mems, hist, auditLogs, consoleOverview, auditEvents] = await Promise.all([
        api.get('/api/profile'),
        api.get('/api/memories?limit=50'),
        api.get('/api/history?limit=20'),
        api.get('/api/logs?limit=50'),
        api.get('/api/v1/console/overview'),
        api.get('/api/v1/audit/events?limit=50'),
      ]);
      setProfile(prof);
      setMemories(mems);
      setHistory(hist);
      setLogs(auditLogs);
      setSession(activeSession);
      setOverview({ ...consoleOverview, session: activeSession });
      if (activeSession?.session?.accountId && activeSession.session.accountId !== accountId) {
        setAccountIdState(activeSession.session.accountId);
        setAccountId(activeSession.session.accountId);
      }
      setControlEvents(auditEvents.events || []);
      setConnected(true);
      setLastUpdate(new Date());
    } catch (e) {
      console.error('Fetch failed:', e);
      setConnected(false);
    }
  }, [accountId]);

  const handleAccountChange = (next) => {
    setAccountIdState(next);
    setAccountId(next);
    setTimeout(fetchAll, 0);
  };

  const loginSession = async (challengeId, code) => {
    const payload = await api.post('/api/v1/auth/verify', { challengeId, code });
    const nextAccount = payload.accountId || payload.session?.accountId || accountId;
    setAccountIdState(nextAccount);
    setAccountId(nextAccount);
    setSession({ ok: true, authenticated: true, session: payload.session });
    await fetchAll();
  };

  const logoutSession = async () => {
    await api.post('/api/v1/auth/logout', {});
    setSession({ ok: true, authenticated: false, session: null });
    await fetchAll();
  };

  const fetchRepos = useCallback(async () => {
    setReposLoading(true);
    try {
      const data = await api.get('/api/repos');
      if (Array.isArray(data)) setRepos(data);
    } catch (e) { console.error('Repo fetch failed:', e); }
    setReposLoading(false);
  }, []);

  // Initial load
  useEffect(() => { fetchAll(); fetchRepos(); }, []);

  // Auto-poll every 3 seconds for SDK data
  useEffect(() => {
    const interval = setInterval(fetchAll, 3000);
    return () => clearInterval(interval);
  }, [fetchAll]);

  // Auto-poll repos every 60 seconds
  useEffect(() => {
    const interval = setInterval(fetchRepos, 60000);
    return () => clearInterval(interval);
  }, [fetchRepos]);

  const highScoreCount = memories.filter(m => (m.score || 0) > 0.5).length;
  const pendingTx = history.filter(t => t.status === 'pending').length;
  const prCount = repos.filter(r => r.status === 'pr-open').length;

  const tabs = [
    { id: 'console', label: 'Console', icon: 'M' },
    { id: 'session', label: 'Session', icon: 'S' },
    { id: 'brain', label: 'Brain', icon: 'B' },
    { id: 'developer', label: `API Keys (${(overview?.apiKeys || []).length})`, icon: 'K' },
    { id: 'billing', label: 'Billing', icon: '$' },
    { id: 'memories', label: 'Memories', icon: '\u{1F9E0}' },
    { id: 'payments', label: 'Payments', icon: '\u{1F4B0}' },
    { id: 'repos', label: `Repos (${repos.length})`, icon: '\u{1F4E6}' },
    { id: 'control-audit', label: `Control Audit (${controlEvents.length})`, icon: 'A' },
    { id: 'audit', label: 'Legacy Audit', icon: '\u{1F4CB}' },
  ];

  return (
    <div className="max-w-7xl mx-auto px-4 py-6">
      {/* Header */}
      <div className="flex items-center justify-between mb-8">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 bg-gradient-to-br from-teal to-mnemo rounded-xl flex items-center justify-center text-lg font-bold text-white">
            M
          </div>
          <div>
            <h1 className="text-xl font-bold text-white">MnemoPay Console</h1>
            <p className="text-xs text-gray-500">Brain, wallet, and audit trail for AI agents {lastUpdate ? `| Updated ${lastUpdate.toLocaleTimeString()}` : ''}</p>
          </div>
        </div>
        <div className="flex items-center gap-3">
          {session?.authenticated ? (
            <div className="text-right">
              <div className="text-xs text-gray-500 uppercase tracking-wider">Signed in as</div>
              <div className="text-sm font-mono text-white">{sanitize(session.session?.email || '—')}</div>
              <div className="text-[10px] text-gray-500 font-mono">account: {sanitize(session.session?.accountId || accountId)}</div>
            </div>
          ) : (
            <div className="text-right">
              <div className="text-xs text-amber-400 uppercase tracking-wider">Not signed in</div>
              <div className="text-[10px] text-gray-500 font-mono">account: {sanitize(accountId)} (anonymous)</div>
            </div>
          )}
          <ConnectionIndicator connected={connected} />
        </div>
      </div>

      {/* Stats Row */}
      <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
        <StatCard label="Wallet" value={`$${(profile.wallet || 0).toFixed(2)}`} sub="Available balance" color="teal" icon="\u{1F4B0}" />
        <StatCard label="Memories" value={profile.memoriesCount || 0} sub={`${highScoreCount} high-score`} color="blue" icon="\u{1F9E0}" />
        <StatCard label="Transactions" value={profile.transactionsCount || 0} sub={`${pendingTx} pending`} color="amber" icon="\u{1F4CA}" />
        <StatCard label="PRs Open" value={prCount} sub={`${repos.length} repos monitored`} color="purple" icon="\u{1F680}" />
        <StatCard label="Control Events" value={controlEvents.length} sub="Console audit trail" color="indigo" icon="A" />
      </div>

      {/* Reputation Bar */}
      <div className="glass rounded-xl p-4 mb-6">
        <ReputationBar value={profile.reputation} />
        <div className="flex gap-4 mt-3 text-[10px] text-gray-500">
          <span>Ceiling: ${(500 * (profile.reputation || 0)).toFixed(0)}/charge</span>
          <span>Decay: 0.05 (half-life ~14h)</span>
          <span>Feedback Loop: +0.05 importance on settle</span>
        </div>
      </div>

      {/* Tabs */}
      <div className="flex gap-6 border-b border-white/10 mb-6">
        {tabs.map(t => (
          <button key={t.id} onClick={() => { setTab(t.id); if (t.id === 'repos') fetchRepos(); }}
            className={`pb-3 text-sm font-medium transition ${tab === t.id ? 'tab-active' : 'text-gray-500 hover:text-gray-300'}`}>
            <span className="mr-1.5">{t.icon}</span>{t.label}
          </button>
        ))}
      </div>

      {/* Tab Content */}
      {tab === 'console' && <ConsolePanel overview={overview} accountId={accountId} onAccountChange={handleAccountChange} onRefresh={fetchAll} />}
      {tab === 'session' && <SessionPanel session={session} accountId={accountId} members={overview?.members || []} onLogin={loginSession} onLogout={logoutSession} onRefresh={fetchAll} />}
      {tab === 'brain' && <BrainPanel onRefresh={fetchAll} />}
      {tab === 'developer' && <DeveloperPanel apiKeys={overview?.apiKeys || []} onRefresh={fetchAll} />}
      {tab === 'billing' && <BillingPanel overview={overview} onRefresh={fetchAll} />}
      {tab === 'memories' && <MemoryPanel memories={memories} onRefresh={fetchAll} />}
      {tab === 'payments' && <PaymentPanel history={history} onRefresh={fetchAll} />}
      {tab === 'repos' && <ReposPanel repos={repos} loading={reposLoading} onRefresh={fetchRepos} />}
      {tab === 'control-audit' && <ControlAuditPanel events={controlEvents} />}
      {tab === 'audit' && <AuditPanel logs={logs} />}

      {/* Footer */}
      <div className="mt-12 text-center text-xs text-gray-600 pb-8">
        @mnemopay/sdk | Console prototype | Hosted brain + wallet + audit controls
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
</script>
</body>
</html>
